# ──────────────────────────────────────────────────────────────────────────────
#  Shellscape tmux.conf   (~/.config/tmux/tmux.conf)
#  prefix = Ctrl-a   |   prefix + I  installs plugins (TPM)
# ──────────────────────────────────────────────────────────────────────────────

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# True color + undercurl
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Behaviour
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
setw -g mode-keys vi

# Splits & navigation (open in current dir)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Copy mode (vi)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Status bar — Catppuccin Mocha colours
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 30
set -g status-left "#[bg=#cba6f7,fg=#11111b,bold]  #S #[bg=#1e1e2e,fg=#cba6f7]"
set -g status-right "#[fg=#89b4fa]#[bg=#89b4fa,fg=#11111b] 󰍛 #(free -h | awk '/Mem/{print $3}') #[fg=#a6e3a1,bg=#89b4fa]#[bg=#a6e3a1,fg=#11111b]  %H:%M #[fg=#f5c2e7,bg=#a6e3a1]#[bg=#f5c2e7,fg=#11111b]  #h "
setw -g window-status-format "#[fg=#6c7086]  #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#f5e0dc,bold]  #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
run '~/.tmux/plugins/tpm/tpm'
