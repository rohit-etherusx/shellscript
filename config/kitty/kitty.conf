# ──────────────────────────────────────────────────────────────────────────────
#  Shellscape kitty.conf  —  https://sw.kovidgoyal.net/kitty/conf/
# ──────────────────────────────────────────────────────────────────────────────

# Font (installed by modules/10-fonts.sh)
font_family             JetBrainsMono Nerd Font
bold_font               auto
italic_font             auto
bold_italic_font        auto
font_size               12.0
disable_ligatures       never

# Cursor
cursor_shape            beam
cursor_blink_interval   0.5
cursor_trail            3

# Scrollback / mouse
scrollback_lines        10000
mouse_hide_wait         2.0
copy_on_select          yes
strip_trailing_spaces   smart
url_style               curly

# Window
remember_window_size    yes
window_padding_width    8
hide_window_decorations no
background_opacity      0.95
background_blur         20
confirm_os_window_close 0
enable_audio_bell       no
visual_bell_duration    0.0

# Tabs
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"

# Shell integration (prompt marks, jump between prompts with ctrl+shift+z/x)
shell_integration       enabled

# Keybindings (in addition to kitty defaults)
map ctrl+shift+enter    new_window_with_cwd
map ctrl+shift+t        new_tab_with_cwd
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+equal    change_font_size all +1.0
map ctrl+shift+minus    change_font_size all -1.0
map ctrl+shift+0        change_font_size all 0
map f11                 toggle_fullscreen

# Theme
include theme.conf
